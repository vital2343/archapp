services:
  # Приложения собираются из target/*.jar, поэтому перед `docker compose build` нужен `mvn clean install`
  user-service:
    build:
      context: ../user-service
      dockerfile: Dockerfile
    container_name: user-service
    environment:
      SPRING_DATA_REDIS_HOST: keydb
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres:5432/apidemo-db'
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - keydb
      - rabbitmq
    restart: unless-stopped

  notification-service:
    build:
      context: ../notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      - rabbitmq
    restart: unless-stopped

  postgres:
    image: postgres:13.3
    container_name: postgres-lab4
    environment:
      POSTGRES_DB: "apidemo-db"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    ports:
      - "5432:5432"
    volumes:
      - .:/var/lib/postgresql/data
    restart: always

  keydb:
    image: "eqalpha/keydb:x86_64_v5.3.3"
    container_name: keydb-lab4
    command: "keydb-server /etc/keydb/redis.conf --server-threads 2"
    volumes:
      - "data:/data"
    ports:
      - "6379:6379"
    restart: unless-stopped

  rabbitmq:
    image: "rabbitmq:3-management"
    container_name: rabbitmq-archapp-lab4
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"  # по этому порту Prometheus забирает метрики рэббита
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_prometheus true" # плагин для отдачи метрик
    volumes:
      - ./rabbitmq-data:/var/lib/rabbitmq

  prometheus:
    image: prom/prometheus:v2.44.0
    container_name: prometheus-archapp-lab4
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana-archapp-lab4
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning  # датасурс Prometheus и дашборд подключаются автоматически
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.24.0
    container_name: alertmanager-archapp-lab4
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml

  # тестовый SMTP сервер, письма от Alertmanager видны на http://localhost:8025
  mailpit:
    image: axllent/mailpit
    container_name: mailpit-lab4
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  data:
    driver: local
  grafana-data:
